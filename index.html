<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>煜承團隊｜天空競技場・商品實戰修練塔</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/animation.css">
    <!-- 引入 Excel (SheetJS) 與 PDF (pdf.js) 前端解析庫 -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
    <!-- 全頁面底層中央「煜承團隊」巨型榮耀浮水印背景 -->
    <div class="global-bg-watermark">
        <img src="assets/logo.png" alt="煜承團隊背景圖騰" onerror="if(!this.dataset.try){this.dataset.try=1;this.src='assets/logo.jpg';}else{this.style.display='none';}">
    </div>

    <!-- 頂部導覽列 -->
    <header class="top-nav">
        <div class="brand">
            <img class="team-logo" src="assets/logo.png" alt="煜承團隊" onerror="if(!this.dataset.try){this.dataset.try=1;this.src='assets/logo.jpg';}else{this.style.display='none';}">
            <div class="brand-text">
                <span class="team-title">煜承團隊</span>
                <span class="arena-title">天空競技場</span>
            </div>
        </div>
        <nav class="nav-buttons">
            <button onclick="App.switchTab('lobby')" id="btn-lobby" class="active">🏰 競技大廳</button>
            <button onclick="App.switchTab('leaderboard')" id="btn-leaderboard">🏆 樓層英雄榜</button>
            <button onclick="App.switchTab('admin')" id="btn-admin">⚙️ 後台設定</button>
        </nav>
    </header>

    <!-- 主內容區 (RWD 自適應容器) -->
    <main class="app-container">
        <section id="view-lobby" class="view-section active"></section>
        <section id="view-arena" class="view-section"></section>
        <section id="view-leaderboard" class="view-section"></section>
        <section id="view-admin" class="view-section"></section>
    </main>

    <!-- 動態載入 JS 模組 -->
    <script>
        const ver = Date.now();
        document.write('<script src="js/data.js?v=' + ver + '"><\/script>');
        document.write('<script src="js/arena.js?v=' + ver + '"><\/script>');
        document.write('<script src="js/leaderboard.js?v=' + ver + '"><\/script>');
        document.write('<script src="js/admin.js?v=' + ver + '"><\/script>');
    </script>

    <script>
        // =========================================================================
        // 🌐 雲端即時戰況中心設定：請在下方雙引號內貼上您的 Firebase Realtime Database 網址
        // 例如：const FIREBASE_DB_URL = "https://heavens-arena-3d18c-default-rtdb.asia-southeast1.firebasedatabase.app";
        // =========================================================================
        const FIREBASE_DB_URL = "請在這裡貼上您的Firebase網址";

        const CloudSync = {
            getCleanUrl() {
                if (!FIREBASE_DB_URL || FIREBASE_DB_URL.includes("請在這裡") || !FIREBASE_DB_URL.startsWith("http")) {
                    return null;
                }
                return FIREBASE_DB_URL.replace(/\/$/, "");
            },

            // 上傳單一挑戰者的最新戰況（過關晉級、換頭像、後台單筆編輯時自動觸發）
            async pushUser(user) {
                const baseUrl = this.getCleanUrl();
                if (!baseUrl || !user || !user.username) return;
                const key = String(user.username).trim().toLowerCase();
                try {
                    await fetch(`${baseUrl}/users/${encodeURIComponent(key)}.json`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(user)
                    });
                } catch (e) {
                    console.warn('雲端單筆戰況上傳失敗:', e);
                }
            },

            // 批次同步整個挑戰者清單（後台新增或刪除帳號時觸發）
            async pushAllUsers(usersList) {
                const baseUrl = this.getCleanUrl();
                if (!baseUrl || !Array.isArray(usersList)) return;
                const payload = {};
                usersList.forEach(u => {
                    if (u && u.username) {
                        const key = String(u.username).trim().toLowerCase();
                        payload[key] = u;
                    }
                });
                try {
                    await fetch(`${baseUrl}/users.json`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                } catch (e) {
                    console.warn('雲端全體名單上傳失敗:', e);
                }
            },

            // 從雲端拉取全體挑戰者的最新樓層與勝場，並與本機智慧合併
            async pullAllUsers() {
                const baseUrl = this.getCleanUrl();
                if (!baseUrl) return false;
                try {
                    const res = await fetch(`${baseUrl}/users.json?nocache=${Date.now()}`, { cache: 'no-store' });
                    const cloudData = await res.json();
                    const localUsers = DataStore.getUsers();

                    // 若雲端還是空的，主動把本機名單初始化推上雲端
                    if (!cloudData || typeof cloudData !== 'object') {
                        await this.pushAllUsers(localUsers);
                        return true;
                    }

                    const cloudUsers = Object.values(cloudData).filter(u => u && u.username);
                    const mergedMap = new Map();

                    // 1. 先放入本機與 data.js 名單
                    localUsers.forEach(u => {
                        mergedMap.set(String(u.username).trim().toLowerCase(), { ...u });
                    });

                    // 2. 融合雲端其他夥伴的最新戰況（取最高樓層與最高勝場，確保進度只進不退）
                    let hasLocalHigher = false;
                    cloudUsers.forEach(cu => {
                        const key = String(cu.username).trim().toLowerCase();
                        if (mergedMap.has(key)) {
                            const lu = mergedMap.get(key);
                            const maxFloor = Math.max(Number(lu.floor) || 1, Number(cu.floor) || 1);
                            const maxWins = Math.max(Number(lu.wins) || 0, Number(cu.wins) || 0);
                            if ((Number(lu.floor) || 1) > (Number(cu.floor) || 1) || (Number(lu.wins) || 0) > (Number(cu.wins) || 0)) {
                                hasLocalHigher = true;
                            }
                            mergedMap.set(key, {
                                ...lu,
                                ...cu,
                                floor: maxFloor,
                                wins: maxWins,
                                customAvatar: cu.customAvatar || lu.customAvatar || ''
                            });
                        } else {
                            mergedMap.set(key, cu);
                        }
                    });

                    const finalUsers = Array.from(mergedMap.values());
                    localStorage.setItem('ha_users', JSON.stringify(finalUsers));

                    // 若本機有夥伴還沒上傳到的新紀錄或新帳號，順手補推上雲端
                    if (hasLocalHigher || finalUsers.length > cloudUsers.length) {
                        this.pushAllUsers(finalUsers);
                    }
                    return true;
                } catch (e) {
                    console.warn('雲端戰況拉取失敗:', e);
                    return false;
                }
            },

            // 攔截 DataStore 的更新動作，讓闖關晉級與後台修改自動觸發雲端同步
            hookDataStore() {
                if (typeof DataStore === 'undefined' || DataStore._cloudHooked) return;
                DataStore._cloudHooked = true;

                const origUpdateUser = DataStore.updateUser.bind(DataStore);
                DataStore.updateUser = function(updatedUser) {
                    origUpdateUser(updatedUser);
                    CloudSync.pushUser(updatedUser);
                };

                const origSaveUsers = DataStore.saveUsers.bind(DataStore);
                DataStore.saveUsers = function(users) {
                    origSaveUsers(users);
                    CloudSync.pushAllUsers(users);
                };
            }
        };

        const App = {
            async switchTab(tabName) {
                if (typeof ArenaModule !== 'undefined') ArenaModule.clearTimer();
                document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
                document.querySelectorAll('.nav-buttons button').forEach(el => el.classList.remove('active'));

                if (tabName === 'lobby') {
                    document.getElementById('view-lobby').classList.add('active');
                    document.getElementById('btn-lobby').classList.add('active');
                    await CloudSync.pullAllUsers();
                    this.renderLobby();
                } else if (tabName === 'leaderboard') {
                    document.getElementById('view-leaderboard').classList.add('active');
                    document.getElementById('btn-leaderboard').classList.add('active');
                    // 先渲染一次畫面，接著立刻從雲端拉取全體挑戰者最新戰況並刷新英雄榜！
                    LeaderboardModule.render();
                    this.injectLeaderboardSyncBar('🔄 正在同步全體挑戰者最新雲端戰況...');
                    const ok = await CloudSync.pullAllUsers();
                    LeaderboardModule.render();
                    this.injectLeaderboardSyncBar(
                        ok ? '✅ 已即時同步全體挑戰者最新雲端戰況！' 
                           : '⚠️ 尚未設定 Firebase 雲端網址（目前僅顯示本機進度）'
                    );
                } else if (tabName === 'admin') {
                    document.getElementById('view-admin').classList.add('active');
                    document.getElementById('btn-admin').classList.add('active');
                    await CloudSync.pullAllUsers();
                    AdminModule.render();
                } else if (tabName === 'arena') {
                    document.getElementById('view-arena').classList.add('active');
                }
            },

            // 在樓層英雄榜上方自動嵌入「即時刷新戰況」狀態列與按鈕
            injectLeaderboardSyncBar(statusText) {
                const lbContainer = document.getElementById('view-leaderboard');
                if (!lbContainer) return;
                let bar = document.getElementById('lb-cloud-sync-bar');
                if (!bar) {
                    bar = document.createElement('div');
                    bar.id = 'lb-cloud-sync-bar';
                    bar.style.cssText = 'display:flex; justify-content:space-between; align-items:center; background:rgba(56,189,248,0.12); border:1px solid rgba(56,189,248,0.4); border-radius:12px; padding:10px 14px; margin-bottom:14px; flex-wrap:wrap; gap:8px;';
                    lbContainer.prepend(bar);
                }
                bar.innerHTML = `
                    <span style="font-size:0.88rem; color:#e0f2fe; font-weight:600;">${statusText}</span>
                    <button class="btn-secondary" style="padding:5px 12px; font-size:0.82rem;" onclick="App.switchTab('leaderboard')">🔄 立即刷新英雄榜</button>
                `;
            },

            renderLobby() {
                const container = document.getElementById('view-lobby');
                const user = DataStore.getCurrentUser();

                if (!user) {
                    const allUsers = DataStore.getUsers();
                    container.innerHTML = `
                        <div class="glass-card login-card">
                            <div class="hero-logo-showcase">
                                <img class="hero-logo-img" src="assets/logo.png" alt="煜承團隊榮耀勳章" onerror="if(!this.dataset.try){this.dataset.try=1;this.src='assets/logo.jpg';}else{this.style.display='none';}">
                                <div class="hero-logo-title">🔥 煜承團隊・天空競技場 🔥</div>
                                <div class="hero-logo-subtitle">商品實戰修練塔｜挑戰者登錄櫃檯</div>
                            </div>

                            <div class="form-group">
                                <label>挑戰者帳號</label>
                                <input type="text" id="login-user" placeholder="請輸入帳號" autocapitalize="none" autocorrect="off" spellcheck="false">
                            </div>
                            <div class="form-group">
                                <label>挑戰者密碼</label>
                                <input type="password" id="login-pwd" placeholder="請輸入密碼">
                            </div>
                            <button class="btn-primary full-width" id="btn-login-submit" onclick="App.login()">⚔️ 進入天空競技場</button>

                            <div style="margin-top:12px; text-align:center;">
                                <button class="btn-secondary" style="font-size:0.82rem; padding:8px 12px; width:100%;" onclick="App.forceSyncCloudData()">
                                    🔄 點此強制從雲端重新拉取最新名單 (目前內建 ${allUsers.length} 人)
                                </button>
                            </div>

                            <hr class="divider">
                            <h3>🌟 七大念能力初始頭像一覽（由左至右）</h3>
                            <div class="avatar-preview-grid">
                                ${AVATAR_CONFIG.map((a, idx) => `
                                    <div class="avatar-card">
                                        <span class="order-badge">${idx + 1}</span>
                                        <img src="${a.img}" alt="${a.name}" 
                                             onerror="if(!this.dataset.try){this.dataset.try=1;this.src=this.src.replace('.jpg','.png');}else if(this.dataset.try==1){this.dataset.try=2;this.src=this.src.replace('.png','.jpeg');}">
                                        <div class="avatar-title">${a.name}</div>
                                        <span class="nen-tag ${a.nenClass}">${a.nen}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                    return;
                }

                const avatarInfo = DataStore.getAvatarInfo(user);
                const canCustomizeAvatar = user.floor >= 30;
                const nextMasterFloor = [50, 100, 150, 200].find(f => f >= user.floor) || 200;
                const masterInfo = DEFAULT_FLOOR_MASTERS[nextMasterFloor];

                const floorQuestions = DataStore.getQuestions().filter(q => Number(q.floor) === Number(user.floor));
                const currentFloorName = floorQuestions.length > 0 ? floorQuestions[0].floorName : `第 ${user.floor} 層商品修練`;

                container.innerHTML = `
                    <div class="lobby-team-banner">
                        <img class="lobby-banner-logo" src="assets/logo.png" alt="煜承團隊" onerror="if(!this.dataset.try){this.dataset.try=1;this.src='assets/logo.jpg';}else{this.style.display='none';}">
                        <div class="lobby-banner-info">
                            <h3>🔥 煜承團隊・菁英商品實戰修練塔</h3>
                            <p>千錘百鍊商品力，登頂 200 層巔峰強者殿堂！</p>
                        </div>
                    </div>

                    <div class="lobby-grid">
                        <div class="glass-card profile-card">
                            <div class="profile-header">
                                <div class="avatar-wrapper ${avatarInfo.nenClass}">
                                    <img src="${avatarInfo.displayImg}" alt="${user.nickname}" onerror="this.src='assets/avatars/全能巨星.jpg'">
                                    <span class="floor-badge">${user.floor}F</span>
                                </div>
                                <div class="profile-meta">
                                    <h2>${user.nickname} <small>(@${user.username})</small></h2>
                                    <p style="margin-top:6px;">初始形象：<strong>${avatarInfo.name}</strong>｜屬性：<span class="nen-tag ${avatarInfo.nenClass}">${avatarInfo.nen}</span></p>
                                    <p style="margin-top:4px;">必殺技：⚡ <strong>${avatarInfo.attackName}</strong></p>
                                    <p style="margin-top:4px;">累積勝場：<strong>${user.wins || 0} 勝</strong></p>
                                </div>
                            </div>

                            <div class="custom-avatar-box ${canCustomizeAvatar ? 'unlocked' : 'locked'}">
                                <h4>🎨 30樓層榮譽特權：自訂專屬大頭像</h4>
                                ${canCustomizeAvatar ? `
                                    <p style="color:var(--success); margin:6px 0;">✅ 恭喜突破 30 樓層！你已獲得上傳自訂大頭像的資格：</p>
                                    <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:8px;">
                                        <input type="file" id="custom-avatar-input" accept="image/*" onchange="App.uploadCustomAvatar(event)">
                                        <button class="btn-secondary" onclick="App.resetCustomAvatar()">恢復預設頭像</button>
                                    </div>
                                ` : `
                                    <p style="color:var(--text-muted); margin-top:6px;">🔒 尚未解鎖（目前位於 ${user.floor}F，晉升至 <strong>30F</strong> 即可自由上傳頭像！）</p>
                                `}
                            </div>

                            <button class="btn-danger full-width" style="margin-top:15px;" onclick="App.logout()">登出挑戰者帳號</button>
                        </div>

                        <div class="glass-card tower-card" style="position:relative; overflow:hidden;">
                            <img src="assets/logo.png" class="card-corner-logo" onerror="if(!this.dataset.try){this.dataset.try=1;this.src='assets/logo.jpg';}else{this.style.display='none';}">
                            
                            <h2>🗼 天空競技場晉級挑戰</h2>
                            <div class="tower-progress">
                                <div class="progress-bar" style="width: ${Math.min(100, (user.floor / 200) * 100)}%"></div>
                                <span>目前樓層：第 ${user.floor} 層（${currentFloorName}）</span>
                            </div>

                            <div class="boss-alert">
                                <h4>👑 50樓以上關主守門規則</h4>
                                <p>到達 50F、100F、150F、200F 時，將強制迎戰該層<strong>樓層關主 (Floor Master)</strong>！</p>
                                <p>下一位鎮守關主：<strong>${masterInfo.name} (${masterInfo.title})</strong></p>
                            </div>

                            <button class="btn-arena-start" onclick="ArenaModule.startMatch()">
                                ⚔️ 進入第 ${user.floor} 層擂台（${currentFloorName}）
                            </button>
                        </div>
                    </div>
                `;
            },

            async fetchLatestCloudData() {
                try {
                    const res = await fetch('js/data.js?nocache=' + Date.now(), { cache: 'no-store' });
                    const codeText = await res.text();

                    const usersMatch = codeText.match(/const\s+DEFAULT_USERS\s*=\s*(\[[\s\S]*?\]);/);
                    const questionsMatch = codeText.match(/const\s+DEFAULT_QUESTIONS\s*=\s*(\[[\s\S]*?\]);/);

                    if (usersMatch && usersMatch[1]) {
                        const freshUsers = JSON.parse(usersMatch[1]);
                        const localUsers = DataStore.getUsers();
                        const merged = freshUsers.map(fu => {
                            const ex = localUsers.find(lu => String(lu.username).toLowerCase() === String(fu.username).toLowerCase());
                            if (ex) {
                                return {
                                    ...fu,
                                    floor: Math.max(Number(fu.floor) || 1, Number(ex.floor) || 1),
                                    wins: Math.max(Number(fu.wins) || 0, Number(ex.wins) || 0),
                                    customAvatar: ex.customAvatar || fu.customAvatar || ''
                                };
                            }
                            return fu;
                        });
                        localStorage.setItem('ha_users', JSON.stringify(merged));
                    }

                    if (questionsMatch && questionsMatch[1]) {
                        const freshQuestions = JSON.parse(questionsMatch[1]);
                        if (freshQuestions.length > 0) {
                            DataStore.saveQuestions(freshQuestions);
                        }
                    }
                    // 接著再從 Firebase 拉取所有人的最新樓層進度
                    await CloudSync.pullAllUsers();
                    return true;
                } catch (err) {
                    console.error('雲端同步失敗:', err);
                    return false;
                }
            },

            async forceSyncCloudData() {
                await this.fetchLatestCloudData();
                const updatedUsers = DataStore.getUsers();
                const names = updatedUsers.map(u => `${u.nickname}(@${u.username} - ${u.floor}F)`).join('、');
                alert(`✅ 已成功同步全體最新名單與戰況！\n\n目前名單共 ${updatedUsers.length} 人：\n${names}`);
                this.renderLobby();
            },

            async login() {
                const rawInput = document.getElementById('login-user').value.trim();
                const u = rawInput.replace(/\s+/g, '').toLowerCase();
                const p = document.getElementById('login-pwd').value.replace(/\s+/g, '');

                if (!u || !p) {
                    alert('請輸入帳號與密碼！');
                    return;
                }

                const matchUser = (list) => list.find(user => {
                    const dbUser = String(user.username || '').replace(/\s+/g, '').toLowerCase();
                    const dbNick = String(user.nickname || '').replace(/\s+/g, '').toLowerCase();
                    const dbPass = String(user.password || '').replace(/\s+/g, '');
                    const userMatched = (dbUser === u) || (dbNick === u) || (dbUser.replace(/^0+/, '') === u.replace(/^0+/, '') && u.length > 0);
                    return userMatched && dbPass === p;
                });

                let localUsers = DataStore.getUsers();
                const cloudUsers = (typeof DEFAULT_USERS !== 'undefined') ? DEFAULT_USERS : [];
                let found = matchUser([...cloudUsers, ...localUsers]);

                if (!found) {
                    const btn = document.getElementById('btn-login-submit');
                    if (btn) btn.innerText = '🔄 正在同步雲端最新帳號...';
                    await this.fetchLatestCloudData();
                    if (btn) btn.innerText = '⚔️ 進入天空競技場';

                    localUsers = DataStore.getUsers();
                    found = matchUser(localUsers);
                }

                if (!found) {
                    const currentAll = DataStore.getUsers();
                    const availableList = currentAll.map(x => `${x.nickname}(帳號:${x.username})`).join('、');
                    alert(`❌ 帳號或密碼錯誤！\n\n📱 目前雲端內實際存在的帳號清單有：\n【 ${availableList} 】`);
                    return;
                }

                if (!localUsers.some(x => String(x.username).toLowerCase() === String(found.username).toLowerCase())) {
                    localUsers.push(found);
                    DataStore.saveUsers(localUsers);
                }

                localStorage.setItem('ha_current_user', found.username);
                sessionStorage.setItem('ha_current_user', found.username);
                await CloudSync.pullAllUsers();
                this.renderLobby();
            },

            logout() {
                localStorage.removeItem('ha_current_user');
                sessionStorage.removeItem('ha_current_user');
                this.renderLobby();
            },

            uploadCustomAvatar(event) {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(e) {
                    const user = DataStore.getCurrentUser();
                    user.customAvatar = e.target.result;
                    DataStore.updateUser(user);
                    alert('🎉 自訂大頭像更新成功！已同步至英雄榜！');
                    App.renderLobby();
                };
                reader.readAsDataURL(file);
            },

            resetCustomAvatar() {
                const user = DataStore.getCurrentUser();
                user.customAvatar = '';
                DataStore.updateUser(user);
                this.renderLobby();
            }
        };

        window.addEventListener('DOMContentLoaded', async () => {
            CloudSync.hookDataStore();
            await App.fetchLatestCloudData();
            App.renderLobby();
        });
    </script>
</body>
</html>
